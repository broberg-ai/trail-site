<svg viewBox="0 0 690 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three linked documents forming an associative Trail">
  <!-- Document 1: Encyclopedia -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="5" y="50" width="160" height="190"/>
  </g>
  <g stroke="currentColor" stroke-width="0.5" opacity="0.5">
    <line x1="25" y1="90" x2="145" y2="90"/>
    <line x1="25" y1="105" x2="130" y2="105"/>
    <line x1="25" y1="120" x2="140" y2="120"/>
    <line x1="25" y1="135" x2="120" y2="135"/>
    <line x1="25" y1="150" x2="135" y2="150"/>
    <line x1="25" y1="165" x2="125" y2="165"/>
    <line x1="25" y1="180" x2="140" y2="180"/>
    <line x1="25" y1="195" x2="115" y2="195"/>
    <line x1="25" y1="210" x2="130" y2="210"/>
  </g>
  <text x="25" y="75" font-family="monospace" font-size="9" fill="currentColor" font-weight="bold" letter-spacing="0.5">ENCYCLOPEDIA</text>

  <!-- Document 2: History -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="265" y="5" width="160" height="190"/>
  </g>
  <g stroke="currentColor" stroke-width="0.5" opacity="0.5">
    <line x1="285" y1="45" x2="405" y2="45"/>
    <line x1="285" y1="60" x2="390" y2="60"/>
    <line x1="285" y1="75" x2="400" y2="75"/>
    <line x1="285" y1="90" x2="380" y2="90"/>
    <line x1="285" y1="105" x2="395" y2="105"/>
    <line x1="285" y1="120" x2="385" y2="120"/>
    <line x1="285" y1="135" x2="400" y2="135"/>
    <line x1="285" y1="150" x2="375" y2="150"/>
    <line x1="285" y1="165" x2="390" y2="165"/>
  </g>
  <text x="285" y="30" font-family="monospace" font-size="9" fill="currentColor" font-weight="bold" letter-spacing="0.5">HIST · CRUSADES</text>

  <!-- Document 3: Elasticity -->
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <rect x="525" y="70" width="160" height="190"/>
  </g>
  <g stroke="currentColor" stroke-width="0.5" opacity="0.5">
    <line x1="545" y1="110" x2="665" y2="110"/>
    <line x1="545" y1="125" x2="645" y2="125"/>
    <line x1="545" y1="140" x2="660" y2="140"/>
    <line x1="545" y1="155" x2="635" y2="155"/>
    <line x1="545" y1="170" x2="655" y2="170"/>
    <line x1="545" y1="185" x2="640" y2="185"/>
    <line x1="545" y1="200" x2="660" y2="200"/>
    <line x1="545" y1="215" x2="630" y2="215"/>
    <line x1="545" y1="230" x2="650" y2="230"/>
  </g>
  <text x="545" y="95" font-family="monospace" font-size="9" fill="currentColor" font-weight="bold" letter-spacing="0.5">ELASTICITY</text>

  <!-- The amber Trail -->
  <g stroke="#e8a87c" stroke-width="2" fill="none">
    <path d="M90,134c76.7-50,158.3-71.7,245-65"/>
    <path d="M355,73.4c66.7,13.3,148.3,38.3,245,75"/>
  </g>
  <g fill="#e8a87c">
    <circle cx="90" cy="133" r="5"/>
    <circle cx="345" cy="71" r="5"/>
    <circle cx="605" cy="150" r="5"/>
  </g>
  <!-- Small halos -->
  <g fill="none" stroke="#e8a87c" stroke-width="0.6" opacity="0.5">
    <circle cx="90" cy="133" r="10"/>
    <circle cx="345" cy="71" r="10"/>
    <circle cx="605" cy="150" r="10"/>
  </g>

  <!-- Trail annotations -->
  <g font-family="monospace" font-size="9" fill="currentColor" opacity="0.65">
    <text x="179.9" y="45">"Turkish bow"</text>
    <text x="448" y="30">"Material</text>
    <text x="445.3" y="43">Elasticity"</text>
  </g>

  <!-- Caption -->
  <text x="345" y="300" font-family="monospace" font-size="11" fill="currentColor" text-anchor="middle" opacity="0.55" letter-spacing="1.5">AN ASSOCIATIVE TRAIL</text>
  <text x="345" y="318" font-family="monospace" font-size="9" fill="currentColor" text-anchor="middle" opacity="0.4">Bush's own example — why the Turkish bow outperformed the English longbow</text>
</svg>
